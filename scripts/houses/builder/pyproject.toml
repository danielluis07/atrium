[project]
name = "atrium-house-builder"
# The builder version: part of every bake hash, so bump it whenever a change
# to the builder changes what it bakes.
version = "1.0.0"
description = "Compiles a House's exported JSON into a baked GLB and KTX2 lightmaps in headless Blender."
requires-python = "==3.13.*"
dependencies = ["bpy>=5.2,<5.3"]

[tool.uv]
package = false
